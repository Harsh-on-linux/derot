<!doctype html>
<meta charset="utf-8">
<style>
  body { width: 220px; margin: 0; padding: 14px 16px; font: 14px Roboto, Arial, sans-serif; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  label { display: flex; gap: 8px; align-items: center; padding: 6px 0; cursor: pointer; }
  p { color: #606060; font-size: 12px; margin: 10px 0 0; }
</style>
<h1>Derot — Minimal YouTube</h1>
<label><input type="checkbox" id="hideHome" checked> Hide home feed</label>
<label><input type="checkbox" id="hideShorts" checked> Block Shorts</label>
<label><input type="checkbox" id="hideSidebar" checked> Hide recommendations</label>
<label><input type="checkbox" id="hideEndscreen" checked> Hide end screens</label>
<label><input type="checkbox" id="hideComments" checked> Hide comments</label>
<p>Search and watch only.</p>
